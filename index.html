<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>思维集合｜思维模型图鉴</title>
<meta name="description" content="用大白话查已收录的思考方法：名称、提出者、出处、概述和应用。">
<script>
try {
  if (localStorage.getItem("thinking-v2-color") === "dark") {
    document.documentElement.setAttribute("data-color-mode", "dark");
  }
} catch (e) {}
</script>
<style>
:root{
  --bg:#fff; --bg-soft:#fafafa; --bg-hover:#f4f4f5;
  --text:#18181b; --text-2:#52525b; --text-3:#686e79;
  --border:#e4e4e7; --border-hover:#d9dbe0; --border-light:#f0f0f2;
  --brand:#3559d8; --brand-hover:#2a46b4;
  --brand-light:color-mix(in srgb, var(--brand) 9%, var(--bg));
  --accent:#3559d8; --on-brand:#fff;
  --green:#287947; --red:#b94046;
  --radius:8px; --radius-lg:12px;
  --shadow-card:0 1px 2px rgba(0,0,0,.04), 0 4px 14px rgba(0,0,0,.05);
  --shadow-float:0 8px 30px rgba(0,0,0,.12);
  --ease:cubic-bezier(.2,.8,.2,1);
  --site-nav-height:60px;
  color-scheme:light;
}
:root[data-color-mode="dark"]{
  color-scheme:dark;
  --brand:#7b93ea; --brand-hover:color-mix(in srgb, var(--brand) 88%, white);
  --accent:#7b93ea; --on-brand:#1b1d21;
  --bg:#1b1d21; --bg-soft:#22252a; --bg-hover:#2c3036;
  --text:#d9dce2; --text-2:#b3b9c4; --text-3:#949da9;
  --border:#3e444e; --border-hover:#525a66; --border-light:#30353d;
  --green:#8ac89e; --red:#e3a1a5;
  --brand-light:color-mix(in srgb, var(--brand) 9%, var(--bg));
  --shadow-card:0 1px 2px rgb(0 0 0 / 18%), 0 4px 14px rgb(0 0 0 / 12%);
  --shadow-float:0 8px 30px rgb(0 0 0 / 24%);
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Microsoft YaHei",sans-serif;
  background:var(--bg); color:var(--text);
  font-size:15px; line-height:1.7; letter-spacing:.1px;
  -webkit-font-smoothing:antialiased;
}
html.theme-anim body,
html.theme-anim .nav,
html.theme-anim .card,
html.theme-anim .card-demo,
html.theme-anim .search-box,
html.theme-anim .detail-page,
html.theme-anim .site-footer,
html.theme-anim .meta-grid div,
html.theme-anim .catalog-finder:before{
  transition:background-color .32s var(--ease), color .32s var(--ease), border-color .32s var(--ease), box-shadow .32s var(--ease), transform .25s var(--ease);
}
button,input{font-family:inherit}
button{cursor:pointer}
::selection{background:var(--brand-light)}
a{color:inherit}
.site-shell{min-height:100dvh; display:flex; flex-direction:column}
.site-shell>main{min-width:0; flex:1 0 auto}

.nav{
  position:sticky; top:0; z-index:50;
  display:flex; align-items:center; justify-content:space-between;
  height:var(--site-nav-height); padding:0 32px; flex-shrink:0;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--border-light);
}
.nav-left,.nav-right,.nav-primary{display:flex; align-items:center}
.nav-right{min-width:0; gap:16px}
.nav-primary{gap:4px; margin-left:18px}
.nav-primary-item{
  min-height:34px; display:inline-flex; align-items:center; justify-content:center;
  padding:7px 11px; border:0; border-radius:8px;
  color:var(--text-2); background:transparent;
  font-size:14px; font-weight:550; line-height:20px;
  text-decoration:none; white-space:nowrap;
  transition:color .2s var(--ease), background-color .2s var(--ease);
}
.nav-primary-item:hover{color:var(--text); background:var(--bg-soft)}
.nav-primary-item.is-current{color:var(--text); background:var(--bg-hover); font-weight:650}
.nav-primary-item:focus-visible,.vh-logo:focus-visible{outline:2px solid var(--brand); outline-offset:3px}

.vh-logo{
  display:flex; align-items:center; gap:6px;
  margin:-7px -3px; padding:7px 3px;
  text-decoration:none; color:var(--text);
  user-select:none;
  --vh-logo-rest:42px; --vh-logo-hover:86px;
}
.vh-logo-mark{width:20px; height:20px; flex:none; color:var(--text); transition:transform .36s cubic-bezier(.22,1,.36,1)}
.vh-logo:hover .vh-logo-mark,.vh-logo:focus-visible .vh-logo-mark{transform:scale(1.03) rotate(-2deg)}
.vh-logo-stage{position:relative; display:block; width:var(--vh-logo-rest); height:20px; transition:width .5s cubic-bezier(.22,1,.36,1)}
.vh-logo-stage:after{
  content:""; position:absolute; z-index:2; left:20px; bottom:-4px;
  width:12px; height:2px; border-radius:999px; background:var(--brand);
  box-shadow:0 1px 5px color-mix(in srgb, var(--brand) 24%, transparent);
  transition:left .44s cubic-bezier(.22,1,.36,1), width .44s cubic-bezier(.22,1,.36,1);
}
.vh-word{
  position:absolute; left:0; top:50%; white-space:nowrap; pointer-events:none;
  font-size:16px; font-weight:760; letter-spacing:-.04em; line-height:1; color:var(--text);
  transition:opacity .24s ease, transform .42s cubic-bezier(.22,1,.36,1), filter .3s ease;
}
.vh-word-brand{transform:translateY(-50%)}
.vh-word-tagline{opacity:0; font-size:14px; font-weight:650; letter-spacing:-.02em; transform:translateY(calc(-50% + 5px)); filter:blur(2px)}
.vh-logo:hover .vh-logo-stage,.vh-logo:focus-visible .vh-logo-stage{width:var(--vh-logo-hover)}
.vh-logo:hover .vh-logo-stage:after,.vh-logo:focus-visible .vh-logo-stage:after{left:0; width:100%}
.vh-logo:hover .vh-word-brand,.vh-logo:focus-visible .vh-word-brand{opacity:0; transform:translateY(calc(-50% - 5px)); filter:blur(2px)}
.vh-logo:hover .vh-word-tagline,.vh-logo:focus-visible .vh-word-tagline{opacity:1; transform:translateY(-50%); filter:blur(0); transition-delay:.11s}

.nav-search{position:relative; z-index:2; min-width:0; width:min(360px, 30vw); flex:0 1 360px}
.search-box{
  width:100%; height:36px; display:flex; align-items:center; gap:8px;
  padding:0 12px; background:color-mix(in srgb, var(--bg) 94%, transparent);
  border:1px solid var(--border); border-radius:999px;
  transition:border-color .2s, box-shadow .2s;
}
.search-box:focus-within{border-color:var(--brand); box-shadow:0 0 0 3px color-mix(in srgb, var(--brand) 10%, transparent)}
.search-box:focus-within .search-icon{color:var(--brand)}
.search-icon{flex:none; color:var(--text-3); transition:color .2s var(--ease)}
.search-box input{
  flex:1 1; min-width:0; border:none; outline:none; background:none;
  font-size:13px; color:var(--text);
}
.search-box input::placeholder{color:var(--text-3)}
.search-box input::-webkit-search-cancel-button{display:none}
.search-clear{
  flex:none; width:22px; height:22px; border:none; border-radius:50%;
  background:var(--bg-hover); color:var(--text-2); font-size:13px; line-height:1;
  transition:background .15s ease, transform .15s var(--ease);
}
.search-clear:hover{background:var(--border)}
.search-clear:active{transform:scale(.9)}
.search-clear[hidden]{display:none}
.nav-color-mode{
  position:relative;
  flex:0 0 44px; width:44px; height:44px;
  display:inline-flex; align-items:center; justify-content:center;
  padding:0; border:0; border-radius:var(--radius);
  background:transparent; color:var(--text-2);
  transition:background .2s var(--ease), color .2s var(--ease), transform .2s var(--ease);
}
.nav-color-mode:hover{background:var(--bg-hover); color:var(--text)}
.nav-color-mode:active{transform:scale(.94)}
.nav-color-mode:focus-visible{outline:2px solid var(--accent); outline-offset:-2px}
.nav-color-mode svg{
  position:absolute; width:20px; height:20px;
  transition:opacity .22s ease, transform .36s var(--ease);
}
.color-mode-moon{opacity:1; transform:none}
.color-mode-sun{opacity:0; transform:rotate(-30deg) scale(.72)}
:root[data-color-mode="dark"] .color-mode-moon{opacity:0; transform:rotate(30deg) scale(.72)}
:root[data-color-mode="dark"] .color-mode-sun{opacity:1; transform:none}

.catalog-page{
  position:relative; isolation:isolate;
  min-height:calc(100vh - var(--site-nav-height));
  background:var(--bg);
}
.catalog-layout{
  position:relative;
  width:100%; max-width:1540px; margin:0 auto;
  padding:20px 40px 96px;
  display:grid; grid-template-columns:minmax(0, 1fr);
  row-gap:2px; align-items:start;
}
.catalog-finder-sentinel{position:absolute; top:0; left:32px; width:1px; height:1px; pointer-events:none}
.catalog-finder{
  grid-column:1 / -1;
  position:sticky; top:var(--site-nav-height); z-index:40;
  margin:0; padding:4px 0 16px; isolation:isolate;
}
.catalog-finder:before{
  content:""; position:absolute; z-index:-1; inset-block:0; left:50%;
  width:100vw; transform:translateX(-50%);
  border-bottom:1px solid color-mix(in srgb, var(--border) 86%, var(--text-3));
  background:color-mix(in srgb, var(--bg) 94%, transparent);
  box-shadow:0 8px 14px -12px color-mix(in srgb, var(--text) 14%, transparent);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  opacity:0; pointer-events:none; transition:opacity .16s ease;
}
.catalog-finder.is-stuck:before{opacity:1}
.catalog-finder-row{min-height:36px; display:flex; align-items:center}
.catalog-filter-list{width:100%; min-width:0; display:flex; align-items:center; flex-wrap:wrap; gap:6px 8px}
.catalog-filter-chip{
  min-height:34px; padding:6px 12px;
  display:inline-flex; align-items:center; gap:6px; flex:none;
  border:0; border-radius:var(--radius); background:transparent; color:var(--text-2);
  font-size:13px; line-height:1.3; white-space:nowrap;
  transition:color .18s ease, background-color .18s ease, transform .18s var(--ease);
}
.catalog-filter-chip span{color:var(--text-3); font-size:11px; font-weight:450; font-variant-numeric:tabular-nums; transition:color .18s ease}
.catalog-filter-chip:hover{color:var(--text); background:var(--bg-soft)}
.catalog-filter-chip:active{transform:translateY(1px); background:var(--bg-hover)}
.catalog-filter-chip:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
.catalog-filter-chip[aria-pressed="true"]{color:var(--brand); background:var(--brand-light); font-weight:650}
.catalog-filter-chip[aria-pressed="true"] span{color:inherit; opacity:.72}

.grid-wrap{min-width:0; padding-top:4px}
.catalog-heading{
  display:flex; align-items:baseline; flex-wrap:wrap; gap:10px 14px;
  margin:18px 0 40px; min-height:36px;
  scroll-margin-top:calc(var(--site-nav-height) + var(--finder-h, 54px) + 16px);
}
.catalog-heading h1{
  margin:0; color:var(--text);
  font-size:clamp(28px, 2.2vw, 32px); font-weight:720;
  line-height:1.15; letter-spacing:-.035em;
}
.catalog-count{margin:0; color:var(--text-3); font-size:14px}
.cat-section{margin-bottom:8px}
.cat-title{margin:10px 0 16px; font-size:20px; font-weight:650; letter-spacing:-.02em; color:var(--text)}
.cat-section + .cat-section .cat-title{margin-top:40px}
.grid{display:grid; grid-template-columns:repeat(3, minmax(0, 1fr)); gap:20px}
.card{
  min-width:0; background:var(--bg);
  border:1px solid var(--border); border-radius:var(--radius-lg);
  padding:22px 22px 18px; cursor:pointer;
  display:flex; flex-direction:column; position:relative;
  transition:transform .25s var(--ease), box-shadow .25s var(--ease), border-color .25s;
}
.card:hover{transform:translateY(-3px); box-shadow:var(--shadow-card); border-color:var(--border-hover)}
.card:active{transform:translateY(-1px) scale(.992)}
.card.is-opening{
  transform:translateY(-1px) scale(.994);
  border-color:color-mix(in srgb, var(--brand) 55%, var(--border));
  box-shadow:0 10px 28px color-mix(in srgb, var(--brand) 12%, transparent);
}
.card.is-opening:after{
  content:""; position:absolute; inset:-1px; pointer-events:none;
  border:2px solid color-mix(in srgb, var(--brand) 42%, transparent);
  border-radius:inherit; opacity:.8;
}
.card:focus-visible{outline:2px solid var(--brand); outline-offset:3px}
.card-head{display:flex; align-items:flex-start; gap:10px; margin-bottom:12px; min-height:0}
.card-title-group{min-width:0; flex:1 1 auto; text-decoration:none; color:inherit}
.card-head h3{
  min-width:0; font-size:20px; font-weight:650; letter-spacing:-.02em; line-height:1.35;
}
.card-head h3 span{
  display:inline; margin-left:8px;
  color:var(--brand); font-weight:500; font-size:15px; line-height:1.35;
}
.favorite-button{
  margin-left:auto; flex:none;
  width:28px; height:28px; display:inline-flex; align-items:center; justify-content:center;
  border:0; border-radius:8px; background:transparent; color:var(--text-3);
  transition:background .18s ease, color .18s ease, transform .18s var(--ease);
}
.favorite-button:hover{background:var(--bg-hover); color:var(--text)}
.favorite-button:active{transform:scale(.9)}
.favorite-button[aria-pressed="true"]{color:var(--red)}
.favorite-button[aria-pressed="true"] svg path{fill:currentColor}
.favorite-button.is-pop svg{animation:fav-pop .34s var(--ease)}
.favorite-button:focus-visible{outline:2px solid var(--brand); outline-offset:2px}
@keyframes fav-pop{0%{transform:scale(1)} 45%{transform:scale(1.28)} 100%{transform:scale(1)}}
.card-tagline{
  margin-bottom:18px; color:var(--text-2); font-size:15.5px; line-height:1.75;
  min-height:calc(1.75em * 2);
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
}
.card-quote{position:relative; padding-left:22px}
.card-quote:before{
  content:"“"; position:absolute; left:0; top:-1px;
  font-size:22px; font-weight:700; line-height:1.2; color:var(--accent);
}
.card-demo{
  flex:1 1 auto; width:100%; min-height:156px;
  background:var(--bg-soft); border:1px solid var(--border-light); border-radius:var(--radius);
  padding:28px 22px; overflow:hidden;
  display:flex; align-items:center; justify-content:flex-start;
}
.card .card-demo>*{opacity:.8; transition:opacity .25s var(--ease), filter .25s var(--ease)}
@media (hover:hover) and (pointer:fine){
  .card .card-demo>*{filter:grayscale(.1)}
  .card:hover .card-demo>*{opacity:1; filter:none}
}
.specimen{width:100%; display:flex; flex-direction:column; justify-content:center; gap:6px; text-align:left}
.specimen-kicker{color:var(--brand); font-size:12px; font-weight:650; letter-spacing:.04em}
.specimen-who{
  font-size:15px; font-weight:600; letter-spacing:-.02em; line-height:1.4; color:var(--text);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.specimen p{
  margin:2px 0 0; font-size:13px; line-height:1.6; color:var(--text-3);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#sections{transition:opacity .2s ease, transform .22s var(--ease)}
#sections.is-swapping{opacity:0; transform:translateY(6px)}
mark{background:color-mix(in srgb, var(--brand) 16%, transparent); color:inherit; border-radius:3px; padding:0 1px}

.search-empty{
  text-align:center; padding:80px 20px; color:var(--text-3);
  display:flex; flex-direction:column; gap:8px; align-items:center;
}
.search-empty b{color:var(--text-2); font-size:16px; font-weight:650}
.search-suggest{margin-top:18px; display:flex; flex-direction:column; gap:10px; align-items:center; max-width:520px; width:100%}
.search-suggest-label{font-size:12px; color:var(--text-3)}
.search-suggest-list{display:flex; flex-wrap:wrap; gap:8px; justify-content:center}
.search-suggest-item{
  border:1px solid var(--border); background:var(--bg); color:var(--text);
  border-radius:999px; padding:7px 12px; font-size:13px; line-height:1.2;
  transition:border-color .15s ease, background .15s ease, transform .15s var(--ease);
}
.search-suggest-item:hover{border-color:color-mix(in srgb, var(--brand) 45%, var(--border)); background:var(--brand-light); transform:translateY(-1px)}
.search-suggest-item:active{transform:translateY(0) scale(.98)}

.detail-page{
  position:fixed; z-index:45;
  top:var(--site-nav-height); left:0; right:0; bottom:0;
  overflow:auto; background:var(--bg);
  opacity:0; visibility:hidden; pointer-events:none;
  transform:translateY(10px);
  transition:opacity .22s ease, transform .28s var(--ease), visibility .22s;
}
.detail-page.is-on{opacity:1; visibility:visible; pointer-events:auto; transform:none}
.detail-page[hidden]{display:none}
body.detail-open{overflow:hidden}
.detail{max-width:980px; margin:0 auto; padding:28px 32px 80px; text-align:left}
.detail-topbar{
  position:sticky; top:0; z-index:2;
  display:flex; align-items:center; gap:12px;
  margin:0 -12px; padding:10px 12px;
  background:color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid transparent;
}
.detail-topbar.is-stuck{border-bottom-color:var(--border-light)}
.detail-back-button{
  width:30px; height:30px; flex:none; display:inline-grid; place-items:center;
  border:1px solid var(--border); border-radius:8px;
  color:var(--text-2); background:var(--bg);
  transition:color .2s var(--ease), border-color .2s var(--ease), background .2s var(--ease), transform .2s var(--ease);
}
.detail-back-button:hover{color:var(--brand); border-color:var(--brand); background:var(--brand-light); transform:translateY(-1px)}
.detail-back-button:active{transform:translateY(0) scale(.96)}
.detail-back-button svg{width:15px; height:15px; transition:transform .2s var(--ease)}
.detail-back-button:hover svg{transform:translateX(-2px)}
.detail-breadcrumb{
  flex:1 1 auto; min-width:0;
  display:flex; align-items:center; gap:8px;
  color:var(--text-3); font-size:13px;
}
.detail-breadcrumb button{
  border:0; background:transparent; color:var(--text-2); font:inherit; padding:4px 0;
}
.detail-breadcrumb button:hover{color:var(--brand)}
.breadcrumb-current{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--brand); font-weight:600}
.detail-hero{padding:8px 0 0; margin-bottom:28px}
.detail-hero h1{
  margin:0; color:var(--text); font-size:34px; font-weight:720;
  letter-spacing:-.035em; line-height:1.25;
}
.detail-hero h1 span{
  display:block; margin:10px 0 0;
  color:var(--brand); font-size:17px; font-weight:500;
  letter-spacing:-.01em; line-height:1.45;
}
.dh-tagline{
  margin:18px 0 0;
  color:color-mix(in srgb, var(--brand) 24%, var(--text-2));
  font-size:16px; line-height:1.85;
}
.detail-block{margin-top:40px}
.detail-block h2{
  margin:0 0 16px; display:flex; align-items:center; gap:8px;
  color:var(--brand); font-size:15px; font-weight:650; letter-spacing:.01em;
}
.detail-block h2:before{
  content:""; width:16px; height:3px; border-radius:99px; background:var(--brand); flex:none;
}
.detail-block p{
  margin:0;
  color:color-mix(in srgb, var(--brand) 20%, var(--text-2));
  font-size:15.5px; line-height:1.9;
}
.detail-block p + p{margin-top:22px}
.meta-grid{
  margin-top:44px; display:grid; grid-template-columns:1fr 1fr; gap:12px;
}
.meta-grid div{
  min-width:0; padding:16px 18px;
  border:1px solid color-mix(in srgb, var(--brand) 16%, var(--border-light));
  border-radius:var(--radius); background:color-mix(in srgb, var(--brand) 4%, var(--bg-soft));
}
.meta-grid span{display:block; margin-bottom:6px; color:var(--brand); font-size:12px; font-weight:650}
.meta-grid b{
  display:block; font-weight:600; font-size:15px; line-height:1.7;
  color:color-mix(in srgb, var(--brand) 14%, var(--text));
}

.site-footer{
  position:relative; z-index:2; overflow:hidden;
  padding:0 32px; border-top:1px solid var(--border-light);
  background:linear-gradient(180deg, var(--bg), var(--bg-soft));
}
.site-footer-shell{max-width:1540px; margin:0 auto; padding:28px 8px 22px}
.footer-wordmark{
  font-size:clamp(64px, 7vw, 96px); font-weight:800; line-height:1; letter-spacing:-.06em;
  color:color-mix(in srgb, var(--text) 10%, var(--bg));
  user-select:none;
}
.footer-row{display:flex; justify-content:space-between; gap:16px; align-items:flex-end; margin-top:14px}
.footer-note{color:var(--text-3); font-size:12px; line-height:1.6}
.footer-row a{color:var(--text-2); font-size:13px; font-weight:600; text-decoration:none}
.footer-row a:hover{color:var(--brand)}

@media (max-width:1100px){
  .catalog-layout{padding-inline:24px}
  .grid{grid-template-columns:repeat(2, minmax(0, 1fr)); gap:18px}
}
@media (max-width:960px){
  .catalog-layout{padding-top:8px; row-gap:0}
}
@media (max-width:720px){
  :root{--site-nav-height:64px}
  .nav{padding:0 16px; gap:8px}
  .nav-primary{margin-left:6px}
  .nav-right{gap:4px; flex:1}
  .nav-search{width:auto; flex:1 1 auto}

       "apply": "2011 年这本书由谷歌免费发布，莱辛斯基在沃顿和《纽约时报》的访谈里解释这个名称：它故意接在宝洁的「第一时刻」前面，所以叫做第零。他举的变化是，过去人们主要在买车、买家电时才事先比较，后来连不贵的日用品也会先看评价。品牌用它时，要检查人在搜索和评论里遇到的信息，而不只检查货架和广告。库里的「关键时刻」是卡尔森在北欧航空讲的服务接触；本条专指购买前的在线研究那一下，两者不是同一个时刻。",

<script>
(function () {
  const SHORT = {
    "一": "通用", "二": "博弈", "三": "决策", "四": "系统",
    "五": "哲学", "六": "心理", "七": "营销"
  };
  const SUGGEST = ["第一性原理", "逆向思维", "系统思维", "六顶思考帽", "金字塔原理", "博弈论"];
  const FAV_KEY = "thinking-v2-favs";

  const qInput = document.getElementById("q");
  const searchClear = document.getElementById("searchClear");
  const catChips = document.getElementById("catChips");
  const sectionsEl = document.getElementById("sections");
  const pageTitle = document.getElementById("pageTitle");
  const pageCount = document.getElementById("pageCount");
  const finder = document.getElementById("finder");
  const detailPage = document.getElementById("detailPage");
  const detailBar = document.getElementById("detailBar");

  let activeCat = "all";
  let lastFocus = null;
  let booted = false;
  let openTimer = 0;
  let hideTimer = 0;
  let detailItem = null;

  function loadFavs() {
    try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) || "[]")); }
    catch (e) { return new Set(); }
  }
  let favs = loadFavs();
  function saveFavs() {
    try { localStorage.setItem(FAV_KEY, JSON.stringify(Array.from(favs))); }
    catch (e) {}
  }

  function items() {
    const out = [];
    (ROSTER.categories || []).forEach(function (c) {
      (c.subs || []).forEach(function (s) {
        (s.items || []).forEach(function (it) {
          out.push(Object.assign({ cat: c.name, num: c.num }, it));
        });
      });
    });
    return out;
  }
  const ALL = items();
  function byName(name) {
    for (let i = 0; i < ALL.length; i++) if (ALL[i].name === name) return ALL[i];
    return null;
  }

  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function mark(s, raw) {
    const src = String(s == null ? "" : s);
    if (!raw) return esc(src);
    const q = raw.toLowerCase();
    const lower = src.toLowerCase();
    let out = "", from = 0, i = lower.indexOf(q);
    if (i < 0) return esc(src);
    while (i >= 0) {
      out += esc(src.slice(from, i)) + "<mark>" + esc(src.slice(i, i + q.length)) + "</mark>";
      from = i + q.length;
      i = lower.indexOf(q, from);
    }
    return out + esc(src.slice(from));
  }
  function clip(s) {
    const t = String(s || "").replace(/\s+/g, " ").trim();
    return t.length > 92 ? t.slice(0, 92) + "…" : t;
  }
  function heart(on) {
    return '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19.4 10.9 18.4C6.1 14.2 3.5 11.8 3.5 8.9 3.5 6.5 5.3 4.7 7.7 4.7c1.4 0 2.7.6 3.6 1.7.9-1.1 2.2-1.7 3.6-1.7 2.4 0 4.2 1.8 4.2 4.2 0 2.9-2.6 5.3-7.4 9.5L12 19.4z" fill="' + (on ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  }

  function countOf(cat) {
    if (cat === "fav") return ALL.filter(function (it) { return favs.has(it.name); }).length;
    if (cat === "all") return ALL.length;
    return ALL.filter(function (it) { return it.num === cat; }).length;
  }
  function chip(cls, pressed, key, label, n) {
    return '<button type="button" class="' + cls + '" data-key="' + esc(key) + '" aria-pressed="' + (pressed ? "true" : "false") + '">'
      + esc(label) + "<span>" + n + "</span></button>";
  }
  function paintChips() {
    let html = chip("catalog-filter-chip", activeCat === "all", "all", "全部", countOf("all"));
    (ROSTER.categories || []).forEach(function (c) {
      html += chip("catalog-filter-chip", activeCat === c.num, c.num, SHORT[c.num] || c.name, countOf(c.num));
    });
    html += chip("catalog-filter-chip", activeCat === "fav", "fav", "收藏", countOf("fav"));
    catChips.innerHTML = html;
  }

  function passes(it, raw) {
    if (activeCat === "fav" && !favs.has(it.name)) return false;
    if (activeCat !== "all" && activeCat !== "fav" && it.num !== activeCat) return false;
    if (!raw) return true;
    const blob = [it.name, it.foreign, it.proposer, it.source, it.tagline, it.overview, it.apply, it.cat].join("\n").toLowerCase();
    return blob.indexOf(raw) >= 0;
  }

  function cardHTML(it, raw) {
    const on = favs.has(it.name);
    const foreign = it.foreign ? "<span>" + mark(it.foreign, raw) + "</span>" : "";
    return '<article class="card" tabindex="0" data-name="' + esc(it.name) + '" aria-label="' + esc(it.name) + '">'
      + '<div class="card-head"><a class="card-title-group" href="#' + encodeURIComponent(it.name) + '"><h3>'
      + mark(it.name, raw) + foreign + "</h3></a>"
      + '<button type="button" class="favorite-button" aria-pressed="' + (on ? "true" : "false") + '" aria-label="' + (on ? "取消收藏" : "收藏") + '">'
      + heart(on) + "</button></div>"
      + '<div class="card-tagline card-quote">' + mark(it.tagline, raw) + "</div>"
      + '<div class="card-demo diagram-preview"><div class="specimen">'
      + '<div class="specimen-kicker">提出者</div>'
      + '<div class="specimen-who">' + mark(it.proposer, raw) + "</div>"
      + "<p>" + mark(clip(it.overview), raw) + "</p>"
      + "</div></div></article>";
  }

  function render(scroll) {
    const raw = qInput.value.trim().toLowerCase();
    searchClear.hidden = !qInput.value;
    const shown = ALL.filter(function (it) { return passes(it, raw); });
    paintChips();

    let title = "全部";
    if (raw) title = "搜索";
    else if (activeCat === "fav") title = "收藏";
    else if (activeCat !== "all") {
      const cat = (ROSTER.categories || []).filter(function (c) { return c.num === activeCat; })[0];
      title = cat ? cat.name : "全部";
    }
    pageTitle.textContent = title;
    pageCount.textContent = shown.length + " 个条目";
    if (booted) sectionsEl.classList.add("is-swapping");

    if (!shown.length) {
      const ideas = SUGGEST.filter(byName).slice(0, 5);
      sectionsEl.innerHTML = '<div class="search-empty"><b>没有相符的条目</b><span>换个词，或改上面的类别。</span>'
        + (ideas.length ? '<div class="search-suggest"><div class="search-suggest-label">可以先看这些</div><div class="search-suggest-list">'
          + ideas.map(function (n) { return '<button type="button" class="search-suggest-item" data-suggest="' + esc(n) + '">' + esc(n) + "</button>"; }).join("")
          + "</div></div>" : "")
        + "</div>";
    } else if (raw || activeCat !== "all") {
      sectionsEl.innerHTML = '<section class="cat-section"><div class="grid">' + shown.map(function (it) { return cardHTML(it, raw); }).join("") + "</div></section>";
    } else {
      const groups = [];
      (ROSTER.categories || []).forEach(function (c) {
        const list = shown.filter(function (it) { return it.num === c.num; });
        if (list.length) groups.push({ name: c.name, list: list });
      });
      sectionsEl.innerHTML = groups.map(function (g) {
        return '<section class="cat-section"><h2 class="cat-title">' + esc(g.name) + '</h2><div class="grid">'
          + g.list.map(function (it) { return cardHTML(it, raw); }).join("") + "</div></section>";
      }).join("");
    }
    writeURL();
    if (booted) {
      sectionsEl.classList.add("is-swapping");
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { sectionsEl.classList.remove("is-swapping"); });
      });
    }
    if (booted && scroll) {
      const head = document.querySelector(".catalog-heading");
      if (head) {
        const limit = finder.getBoundingClientRect().bottom + 8;
        const top = head.getBoundingClientRect().top;
        if (top < limit || top > window.innerHeight * 0.4) head.scrollIntoView({ block: "start", behavior: "smooth" });
      }
    }
    booted = true;
    syncFinder();
  }

  function currentQuery() {
    const p = new URLSearchParams();
    const raw = qInput.value.trim();
    if (raw) p.set("q", raw);
    if (activeCat !== "all") p.set("cat", activeCat);
    const s = p.toString();
    return s ? "?" + s : "";
  }
  function writeURL() {
    const hash = location.hash || "";
    const next = location.pathname + currentQuery() + hash;
    if (location.pathname + location.search + location.hash === next) return;
    try { history.replaceState(null, "", next); } catch (e) {}
  }
  function readURL() {
    const p = new URLSearchParams(location.search);
    qInput.value = p.get("q") || "";
    if (p.get("color") === "dark") document.documentElement.setAttribute("data-color-mode", "dark");
    if (p.get("color") === "light") document.documentElement.removeAttribute("data-color-mode");
    const cat = p.get("cat") || "all";
    const known = cat === "all" || cat === "fav" || (ROSTER.categories || []).some(function (c) { return c.num === cat; });
    activeCat = known ? cat : "all";
  }

  function hashName() {
    const raw = location.hash.slice(1);
    if (!raw) return "";
    try { return decodeURIComponent(raw); } catch (e) { return raw; }
  }
  function loosen(text) {
    const chunks = String(text || "").split(/\n{2,}/).map(function (x) { return x.trim(); }).filter(Boolean);
    const out = [];
    chunks.forEach(function (chunk) {
      const sentences = chunk.split(/(?<=[。！？])/).map(function (s) { return s.trim(); }).filter(Boolean);
      if (sentences.length < 3 || chunk.length < 90) { out.push(chunk); return; }
      let buf = "";
      sentences.forEach(function (s) {
        if (buf && (buf + s).length > 96) { out.push(buf); buf = s; }
        else buf += s;
      });
      if (buf) out.push(buf);
    });
    return out;
  }
  function paragraphs(text, raw) {
    const parts = loosen(text);
    if (!parts.length) return "<p>待补</p>";
    return parts.map(function (p) { return "<p>" + mark(p, raw) + "</p>"; }).join("");
  }
  function showDetail(name) {
    const it = byName(name);
    if (!it) { hideDetail(); return; }
    const raw = qInput.value.trim().toLowerCase();
    const h1 = document.getElementById("detailName");
    h1.innerHTML = mark(it.name, raw) + (it.foreign ? "<span>" + mark(it.foreign, raw) + "</span>" : "");
    document.getElementById("detailTagline").innerHTML = mark(it.tagline, raw);
    document.getElementById("detailOverview").innerHTML = paragraphs(it.overview, raw);
    document.getElementById("detailApply").innerHTML = paragraphs(it.apply, raw);
    document.getElementById("detailProposer").innerHTML = mark(it.proposer, raw);
    document.getElementById("detailSource").innerHTML = mark(it.source, raw);
    document.getElementById("crumbCat").textContent = it.cat;
    document.getElementById("crumbCat").dataset.num = it.num;
    document.getElementById("crumbCurrent").textContent = it.name;
    detailItem = it;
    paintFav(document.getElementById("detailFav"), favs.has(it.name), false);
    clearTimeout(hideTimer);
    detailPage.hidden = false;
    document.body.classList.add("detail-open");
    detailPage.scrollTop = 0;
    requestAnimationFrame(function () {
      requestAnimationFrame(function () { detailPage.classList.add("is-on"); });
    });
    document.getElementById("detailBack").focus();
  }
  function hideDetail() {
    if (detailPage.hidden) return;
    detailPage.classList.remove("is-on");
    document.body.classList.remove("detail-open");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (!detailPage.classList.contains("is-on")) detailPage.hidden = true;
      if (lastFocus && lastFocus.focus) lastFocus.focus();
    }, 220);
  }
  function openName(name, el) {
    const card = el && el.classList && el.classList.contains("card")
      ? el
      : document.querySelector('.card[data-name="' + (window.CSS && CSS.escape ? CSS.escape(name) : name) + '"]');
    lastFocus = card || el;
    document.querySelectorAll(".card.is-opening").forEach(function (c) { c.classList.remove("is-opening"); });
    if (card) card.classList.add("is-opening");
    clearTimeout(openTimer);
    openTimer = setTimeout(function () {
      if (card) card.classList.remove("is-opening");
      const next = "#" + encodeURIComponent(name);
      if (location.hash !== next) location.hash = next;
      else showDetail(name);
    }, 150);
  }
  function paintFav(btn, on, pop) {
    if (!btn) return;
    btn.setAttribute("aria-pressed", on ? "true" : "false");
    btn.setAttribute("aria-label", on ? "取消收藏" : "收藏");
    btn.innerHTML = heart(on);
    if (pop) {
      btn.classList.remove("is-pop");
      void btn.offsetWidth;
      btn.classList.add("is-pop");
    }
  }
  function setFav(name, btn) {
    if (favs.has(name)) favs.delete(name); else favs.add(name);
    saveFavs();
    const on = favs.has(name);
    if (btn) paintFav(btn, on, true);
    const selName = window.CSS && CSS.escape ? CSS.escape(name) : name;
    document.querySelectorAll('.card[data-name="' + selName + '"] .favorite-button').forEach(function (b) {
      if (b !== btn) paintFav(b, on, false);
    });
    const countEl = catChips.querySelector('[data-key="fav"] span');
    if (countEl) countEl.textContent = String(countOf("fav"));
    const detailFav = document.getElementById("detailFav");
    if (detailItem && detailItem.name === name && btn !== detailFav) paintFav(detailFav, on, false);
    if (activeCat === "fav") render(false);
  }
  function closeDetail() {
    if (location.hash) history.back();
    else hideDetail();
  }

  catChips.addEventListener("click", function (e) {
    const btn = e.target.closest("button");
    if (!btn) return;
    activeCat = btn.dataset.key;
    render(true);
  });
  sectionsEl.addEventListener("click", function (e) {
    const suggest = e.target.closest("[data-suggest]");
    if (suggest) {
      qInput.value = suggest.dataset.suggest;
      activeCat = "all";
      render(true);
      return;
    }
    const fav = e.target.closest(".favorite-button");
    if (fav) {
      e.preventDefault();
      e.stopPropagation();
      const card = fav.closest(".card");
      const name = card && card.dataset.name;
      if (!name) return;
      setFav(name, fav);
      return;
    }
    const card = e.target.closest(".card");
    if (!card) return;
    if (e.target.closest("a")) e.preventDefault();
    openName(card.dataset.name, card);
  });
  sectionsEl.addEventListener("keydown", function (e) {
    const card = e.target.closest && e.target.closest(".card");
    if (!card) return;
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      openName(card.dataset.name, card);
    }
  });

  qInput.addEventListener("input", function () { render(false); });
  searchClear.addEventListener("click", function () {
    qInput.value = "";
    qInput.focus();
    render(false);
  });
  document.getElementById("searchForm").addEventListener("submit", function (e) { e.preventDefault(); });
  document.getElementById("logoHome").addEventListener("click", function (e) {
    e.preventDefault();
    qInput.value = "";
    activeCat = "all";
    hideDetail();
    try { history.replaceState(null, "", location.pathname); } catch (err) {}
    render(false);
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  document.getElementById("themeBtn").addEventListener("click", function () {
    const root = document.documentElement;
    const dark = root.getAttribute("data-color-mode") === "dark";
    root.classList.add("theme-anim");
    if (dark) root.removeAttribute("data-color-mode");
    else root.setAttribute("data-color-mode", "dark");
    try { localStorage.setItem("thinking-v2-color", dark ? "light" : "dark"); } catch (err) {}
    this.setAttribute("aria-label", dark ? "切换深色" : "切换浅色");
    clearTimeout(this._t);
    this._t = setTimeout(function () { root.classList.remove("theme-anim"); }, 360);
  });
  document.getElementById("detailBack").addEventListener("click", closeDetail);
  document.getElementById("crumbHome").addEventListener("click", closeDetail);
  document.getElementById("crumbCat").addEventListener("click", function () {
    const num = this.dataset.num;
    if (num) activeCat = num;
    qInput.value = "";
    hideDetail();
    try { history.replaceState(null, "", location.pathname); } catch (err) {}
    render(true);
  });
  document.getElementById("detailFav").addEventListener("click", function () {
    const name = hashName();
    if (!name) return;
    setFav(name, this);
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !detailPage.hidden) closeDetail();
    if (e.key === "/" && document.activeElement !== qInput && detailPage.hidden) {
      e.preventDefault();
      qInput.focus();
    }
  });
  window.addEventListener("hashchange", function () {
    const name = hashName();
    if (name && byName(name)) showDetail(name);
    else hideDetail();
  });
  detailPage.addEventListener("scroll", function () {
    detailBar.classList.toggle("is-stuck", detailPage.scrollTop > 4);
  });

  function syncFinder() {
    const h = Math.round(finder.getBoundingClientRect().height);
    document.documentElement.style.setProperty("--finder-h", h + "px");
  }
  const sentinel = document.getElementById("finderSentinel");
  if ("IntersectionObserver" in window) {
    new IntersectionObserver(function (entries) {
      finder.classList.toggle("is-stuck", !entries[0].isIntersecting);
      syncFinder();
    }, { rootMargin: "-60px 0px 0px 0px" }).observe(sentinel);
  }
  window.addEventListener("resize", syncFinder);

  readURL();
  render(false);
  const opened = hashName();
  if (opened && byName(opened)) showDetail(opened);
  const themeBtn = document.getElementById("themeBtn");
  if (document.documentElement.getAttribute("data-color-mode") === "dark") {
    themeBtn.setAttribute("aria-label", "切换浅色");
  }
})();
</script>

<script>
(function () {

    if (node.closest("input, textarea, [contenteditable='true']")) return "text";
    if (node.closest("a, button, [role='button'], select, label, summary, .card, [data-goto]")) return "link";
    return "";
  }
  function setKind(node) {
    var next = kind(node);
    if (next === mode) return;
    mode = next;
    el.classList.toggle("is-text", next === "text");
    el.classList.toggle("is-link", next === "link");
  }
  function hide() {
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    shown = false;
    mode = "";
    el.classList.remove("on", "is-text", "is-link");
  }
  window.addEventListener("pointermove", function (e) {
    if (e.pointerType !== "mouse" && e.pointerType !== "pen") return;
    if (!shown) setKind(e.target);
    x = e.clientX;
    y = e.clientY;
    if (!raf) raf = requestAnimationFrame(paint);
  }, { passive: true });
  window.addEventListener("pointerover", function (e) {
    if (e.pointerType !== "mouse" && e.pointerType !== "pen") return;
    setKind(e.target);
  }, { passive: true });
  window.addEventListener("blur", hide);
  root.addEventListener("pointerleave", hide);
  document.addEventListener("visibilitychange", function () { if (document.hidden) hide(); });
  root.classList.add("has-cursor-fx");
})();
</script>
</body>
</html>
